<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <!-- Sets the saved theme immediately, so the page doesn't flash light first -->
  <script>
    (function () {
      var saved = null;
      try {
        saved = localStorage.getItem("expense-tracker-theme");
      } catch (error) {}
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (prefersDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <h1>Expense Tracker</h1>
      <button type="button" id="theme-toggle" class="secondary-btn">Dark mode</button>
    </div>

    <section class="card">
      <h2>Add expense</h2>
      <form id="expense-form" novalidate>
        <div class="field">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g. Lunch" maxlength="60">
        </div>

        <div class="field">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01">
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date">
        </div>

        <p id="form-error" class="form-error" role="alert"></p>

        <button type="submit">Add expense</button>
      </form>
    </section>

    <section class="card">
      <h2>Filters</h2>
      <div class="filters">
        <div class="field">
          <label for="filter-month">Month</label>
          <input type="month" id="filter-month">
        </div>

        <div class="field">
          <label for="filter-category">Category</label>
          <select id="filter-category">
            <option value="all">All categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Health">Health</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <button type="button" id="clear-filters" class="secondary-btn">Clear filters</button>
      </div>
      <p id="result-count" class="result-count"></p>
    </section>

    <section class="card">
      <h2>Summary</h2>
      <p class="total-line">Total spent: <strong id="total-spent">₹0.00</strong></p>
      <h3>By category</h3>
      <p id="empty-summary" class="empty">Nothing to summarise yet.</p>
      <ul id="category-summary" class="category-list"></ul>
    </section>

    <section class="card">
      <h2>Spending chart</h2>
      <p id="empty-chart" class="empty">Nothing to chart yet.</p>
      <div id="chart-wrap" class="chart-wrap">
        <canvas id="category-chart"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>Expenses</h2>
      <p id="empty-message" class="empty">No expenses yet.</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Description</th>
              <th>Category</th>
              <th class="num">Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expense-list"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script src="script.js"></script>
</body>
</html>
